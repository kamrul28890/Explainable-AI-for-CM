# Model weight revisions, pinned by commit SHA.
#
# Hugging Face repo ids are mutable: `Qwen/Qwen2.5-VL-7B-Instruct` today and the
# same id in six months can be different weights. An unpinned "latest" silently
# changes results and is among the most common reproducibility failures in ML
# work, so the exact revision behind every reported number is recorded here.
#
# Format:  <tier>  <repo_id>  <revision_sha>
#
# `verified` below means the weights were downloaded and this SHA was read back
# from the on-disk snapshot metadata, not merely queried from the Hub.

